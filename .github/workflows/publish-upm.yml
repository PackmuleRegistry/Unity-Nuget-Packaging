name: Mirror Packages
on:
    workflow_dispatch:

# Package count is unbounded, but GitHub Actions matrices cap at 256 jobs.
# We fan out to as many shards as the matrix allows so each shard processes as
# few packages as possible, then round-robin any remainder across those shards.
env:
    MAX_SHARDS: 256

jobs:
    generate-matrix:
        # Computes how many parallel shards to fan the mirror job out into (see MAX_SHARDS above),
        # and emits the shard index list ([0, 1, ..., SHARDS-1]) consumed by the mirror job's matrix.
        runs-on: ubuntu-latest
        outputs:
            shards: ${{ steps.matrix.outputs.shards }}
            shard-count: ${{ steps.matrix.outputs.shard-count }}

        steps:
            - uses: actions/checkout@v4

            - id: matrix
              run: |
                  # Never create more shards than there are packages (avoids empty/no-op matrix jobs)
                  COUNT=$(jq '.packages | length' packages.json)
                  SHARDS=$((COUNT < MAX_SHARDS ? COUNT : MAX_SHARDS))
                  if [ "$SHARDS" -lt 1 ]; then SHARDS=1; fi
                  SHARD_LIST=$(seq 0 $((SHARDS - 1)) | jq -R 'tonumber' | jq -sc .)
                  echo "shard-count=$SHARDS" >> $GITHUB_OUTPUT
                  echo "shards=$SHARD_LIST" >> $GITHUB_OUTPUT

    mirror:
        needs: generate-matrix
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                shard: ${{ fromJson(needs.generate-matrix.outputs.shards) }}

        permissions:
            contents: read
            packages: write # required to publish UPM packages to GitHub Packages (npm registry)
            issues: write   # required to file issues for NuGet packages that can't be mirrored

        steps:
            - uses: actions/checkout@v4

            # Ensure Node.js is installed
            - uses: actions/setup-node@v4
              with:
                  node-version: "20.x"
                  registry-url: "https://npm.pkg.github.com"
                  scope: "@packmuleregistry"

            # Ensure .NET is installed
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 9.0.x

            # Generate and publish every package assigned to this shard (round-robin by index).
            # Each shard runs a single long-lived step so incompatible.json (written by Package.ps1)
            # can accumulate findings across every package handled by this job before we act on them.
            - name: Generate and Publish Packages
              shell: bash
              run: bash ./scripts/publish.sh
              env:
                  SHARD_COUNT: ${{ needs.generate-matrix.outputs.shard-count }}
                  SHARD_INDEX: ${{ matrix.shard }}
                  REGISTRY_OWNER: ${{ github.repository_owner }}
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # used implicitly by `npm publish`/`npm view` via the .npmrc setup-node wrote
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}        # used implicitly by the `gh` CLI for issue search/creation
