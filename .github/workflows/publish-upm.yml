name: Mirror Packages
on:
    workflow_dispatch:

# Package count is unbounded, but GitHub Actions matrices cap at 256 jobs.
# We fan out to as many shards as the matrix allows so each shard processes as
# few packages as possible, then round-robin any remainder across those shards.
env:
    MAX_SHARDS: 256

jobs:
    generate-matrix:
        # Computes how many parallel shards to fan the mirror job out into (see MAX_SHARDS above),
        # and emits the shard index list ([0, 1, ..., SHARDS-1]) consumed by the mirror job's matrix.
        runs-on: ubuntu-latest
        outputs:
            shards: ${{ steps.matrix.outputs.shards }}
            shard-count: ${{ steps.matrix.outputs.shard-count }}

        steps:
            - uses: actions/checkout@v4

            - id: matrix
              run: |
                  # Never create more shards than there are packages (avoids empty/no-op matrix jobs)
                  COUNT=$(jq '.packages | length' packages.json)
                  SHARDS=$((COUNT < MAX_SHARDS ? COUNT : MAX_SHARDS))
                  if [ "$SHARDS" -lt 1 ]; then SHARDS=1; fi
                  SHARD_LIST=$(seq 0 $((SHARDS - 1)) | jq -R 'tonumber' | jq -sc .)
                  echo "shard-count=$SHARDS" >> $GITHUB_OUTPUT
                  echo "shards=$SHARD_LIST" >> $GITHUB_OUTPUT

    mirror:
        needs: generate-matrix
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                shard: ${{ fromJson(needs.generate-matrix.outputs.shards) }}

        permissions:
            contents: read
            packages: write # required to publish UPM packages to GitHub Packages (npm registry)
            issues: write   # required to file issues for NuGet packages that can't be mirrored

        steps:
            - uses: actions/checkout@v4

            # Ensure Node.js is installed
            - uses: actions/setup-node@v4
              with:
                  node-version: "20.x"
                  registry-url: "https://npm.pkg.github.com"
                  scope: "@packmuleregistry"

            # Ensure .NET is installed
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 9.0.x

            # Generate and publish every package assigned to this shard (round-robin by index).
            # Each shard runs a single long-lived step so incompatible.json (written by Package.ps1)
            # can accumulate findings across every package handled by this job before we act on them.
            - name: Generate and Publish Packages
              shell: bash
              run: |
                  mapfile -t PACKAGES < <(jq -r '.packages[]' packages.json)
                  for i in "\${!PACKAGES[@]}"; do
                      # Assign packages to shards round-robin by index so work is spread evenly
                      if [ \(((i \% SHARD_COUNT)) -ne "\){{ matrix.shard }}" ]; then
                          continue
                      fi

                      pkg="\({PACKAGES[\)i]}"
                      echo "::group::\$pkg"
                      # Clear stale output from the previous package in this loop iteration
                      rm -rf artifacts
                      # Snapshot the incompatible-package count before running, so we can tell which
                      # entries (if any) Package.ps1 just added for this specific package
                      before_count=\$(jq 'length' incompatible.json 2>/dev/null || echo 0)
                      pwsh ./Package.ps1 -PackageName "\$pkg"
                      # Package.ps1 may emit multiple UPM packages per NuGet package (the requested
                      # package plus any of its transitive dependencies), so publish each in turn
                      for dir in artifacts/*/; do
                          (
                              cd "\$dir"
                              name=\$(jq -r .name package.json)
                              version=\$(jq -r .version package.json)
                              
                              # 1. Define the Registry URL dynamically using the GitHub Actions context
                              REGISTRY_URL="https://npm.pkg.github.com/@\${{ github.repository_owner }}"

                              # Shared transitive dependencies get regenerated by multiple packages/shards;
                              # skip re-publishing a version that's already on the registry to avoid a 409
                              if npm view "\$name@version" version --registry="REGISTRY_URL" >/dev/null 2>&1; then
                                  echo "\(name@\)version already published, skipping"
                              else
                                  # 2. Publish to the explicitly scoped registry URL route
                                  npm publish --registry="\$REGISTRY_URL"
                              fi
                          )
                      done

                      # File an issue for any package that lacks netstandard2.0/2.1 support (skip if one is already open)
                      after_count=\$(jq 'length' incompatible.json 2>/dev/null || echo 0)
                      if [ "\(after_count" -gt "\)before_count" ]; then
                          # Only the newly appended slice belongs to this package; earlier entries were
                          # already handled (and possibly already have open issues) in prior iterations
                          jq -c ".[\(before_count:\)after_count][]" incompatible.json | while read -r entry; do
                              id=(echo "entry" | jq -r .id)
                              version=(echo "entry" | jq -r .version)
                              requested=(echo "entry" | jq -r .requestedPackage)
                              title="Incompatible NuGet package: \$id"
                              # Search for an existing open issue with the same title to avoid duplicate spam on reruns
                              existing=\$(gh issue list --state open --search "in:title \"\$title\"" --json number --jq '.[0].number')
                              if [ -z "\$existing" ]; then
                                  gh issue create --title "\$title" --body "NuGet package \`$id\` (version \`$version\`, requested via \`$requested\`) does not provide a netstandard2.0 or netstandard2.1 assembly and cannot be mirrored to UPM."
                              fi
                          done
                      fi
                      echo "::endgroup::"
                  done
              env:
                  SHARD_COUNT: ${{ needs.generate-matrix.outputs.shard-count }}
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # used implicitly by `npm publish`/`npm view` via the .npmrc setup-node wrote
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}        # used implicitly by the `gh` CLI for issue search/creation
